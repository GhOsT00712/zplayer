[package]
name = "zplayer-android"
version = "0.2.1"
edition = "2021"
description = "ZPLAYER for Android: the Tauri v2 shell around the phone UI"

[lib]
# Android loads the app as a shared library; the rlib keeps `cargo check` and desktop runs working.
name = "zplayer_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
zplayer-spotify-auth = { path = "../../../shared/spotify-auth" }
