[package]
name = "zplayer"
version = "0.1.0"
edition = "2021"
description = "ZPLAYER: a Zune HD-styled Spotify player for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["sync"] }
url = "2"
zplayer-spotify-auth = { path = "../../../shared/spotify-auth" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
